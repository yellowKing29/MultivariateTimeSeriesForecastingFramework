global:
  dataset_path: data/raw/weather.csv
  look_back: 96
  horizon: 96
  target_columns: null
models:
  sarimax1:
    order:
    - 2
    - 0
    - 1
    seasonal_order:
    - 1
    - 1
    - 1
    - 24
    enforce_stationarity: false
    enforce_invertibility: false
  sarimax:
    seasonal_period: 24
    max_train_size: 720
  randomForest:
    n_estimators: 200
    max_depth: 15
    min_samples_split: 10
    n_jobs: -1
  xgboost_cd:
    n_estimators: 100
    max_depth: 4
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.2
    max_bin: 32
    max_cached_hist_node: 16
    max_train_samples: 12000
  xgboost_ci:
    n_estimators: 100
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    max_bin: 256
  itransformer:
    d_model: 512
    n_heads: 8
    e_layers: 2
    dropout: 0.1
    batch_size: 16
    epochs: 20
    learning_rate: 0.0001
    patience: 3
    use_amp: true
  dlinear:
    moving_avg_window: 25
    epochs: 50
    batch_size: 32
    learning_rate: 0.001
    patience: 5
orchestration:
  models_to_run:
  - randomForest
  experiment_name: experimentoWeatherRF96
